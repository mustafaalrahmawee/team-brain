map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 55M;

    root /var/www/html/public;

    # Laravel: API, Broadcasting-Auth, Horizon, Scramble-Doku, Health-Check
    location ~ ^/(api|broadcasting|horizon|docs|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/vendor/ {
        try_files $uri =404;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        # Chat-Streaming: Tokens sofort an den Browser durchreichen
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
    }

    # Alles andere: Vue-SPA (Vite-Dev-Server inkl. HMR-WebSocket)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }
}
